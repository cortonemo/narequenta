<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Letalidade Nárëquenta v0.7</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f0f0; }
        .calculator-container { 
            border: 2px solid #5a5a5a; 
            padding: 15px; 
            margin-top: 30px; 
            text-align: left; 
            background-color: #ffffff;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        fieldset {
            border: 1px solid #ccc;
            padding: 10px;
            flex: 1;
            margin-bottom: 10px;
        }
        legend {
            font-weight: bold;
            color: #3b3b3b;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        input[type="number"], input[type="text"] {
            width: 50px;
            padding: 4px;
            border: 1px solid #ddd;
            text-align: center;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background-color: #cc0000;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #a00000;
        }
        #damage-output {
            font-size: 1.5em;
            color: #cc0000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h2 style="text-align: center; margin-top: 0; color: #333;">⚔️ CALCULADORA DE LETALIDADE v0.7</h2>
        
        <div style="display: flex; justify-content: space-around; gap: 20px;">
            <fieldset>
                <legend>ATACANTE (PC)</legend>
                <label>E_CUR (%): <input type="number" id="a-ecur" value="70" min="0" max="100"></label>
                <label>TIER (I-V): <input type="text" id="a-tier" value="III" maxlength="2"></label>
                <hr>
                <label>d100 ROLADO: <input type="number" id="a-d100" value="50" min="1" max="100"></label>
                <label>R_PROF ROLADO: <input type="number" id="a-rprof" value="16" min="0"></label>
            </fieldset>

            <fieldset>
                <legend>DEFENSOR (NPC/PC)</legend>
                <label>E_CUR (%): <input type="number" id="d-ecur" value="70" min="0" max="100"></label>
                <label>TIER (I-V): <input type="text" id="d-tier" value="III" maxlength="2"></label>
                <hr>
                <label>d100 DEFESA: <input type="number" id="d-d100" value="50" min="1" max="100"></label>
            </fieldset>
        </div>

        <button onclick="runDamageCalculation()">
            CALCULAR DANO FINAL
        </button>
        
        <hr style="border-top: 1px dashed #ccc;">

        <h3 style="margin: 5px 0;">DANO FINAL: <span id="damage-output">0 HP</span></h3>
        <p id="details-output" style="font-size: 0.85em; color: #5a5a5a; margin: 0;"></p>
    </div>
    <script>
        // --- CONSTANTES V0.7 ---
        const TIER_AVGS = {
            'V': 27.5, 'IV': 22.0, 'III': 16.5, 'II': 11.0, 'I': 5.5, '0': 0.0
        };

        const DTA_MULTIPLIERS = {
            '0': 1.0, '1': 0.75, '2': 0.50, '3': 0.25, '-1': 1.0, '-2': 1.0, '-3': 1.0
        };

        function getTierDifference(defenderTier, attackerTier) {
            const tierMap = {'V': 5, 'IV': 4, 'III': 3, 'II': 2, 'I': 1, '0': 0};
            const diff = (tierMap[defenderTier] || 0) - (tierMap[attackerTier] || 0);
            
            // Clamping rules defined in v0.7 balance phase
            if (diff < -1) return -1; 
            if (diff > 3) return 3;   
            return diff;
        }

        /**
         * Calcula o dano final baseado na Fórmula de Letalidade de Precisão v0.7.
         * D_Final = max(0, (A_FP - M_Defense + D_Margin + R_prof)) * M_DTA
         */
        function calculateDamage(a_Ecur, a_Tier, d_Ecur, d_Tier, d100_A, r_prof, d100_D) {
            // 1. Mitigação e Verificação de Acerto
            const d100_A_mitigated = d100_A - r_prof;
            const isHit = d100_A_mitigated <= a_Ecur;

            if (!isHit) {
                return { damage: 0, a_FP: 0, d_Margin: 0, status: "FALHA (Rolagem de Ataque Acima do E_cur)" };
            }
            
            // 2. Componentes Tier-Neutros e Margens
            const a_FP = 100 - d100_A_mitigated; // Margem de Potencial Total (Baseado no 100)
            const d_Margin = d100_D - d_Ecur; // Margem do Defensor (Positivo = Falha; Negativo = Parry)
            const m_Defense = TIER_AVGS[d_Tier] || 0; // Mitigação de Defesa do Defensor

            // 3. Multiplicador de Vantagem (DTA)
            const tierDifference = getTierDifference(d_Tier, a_Tier);
            const m_DTA = DTA_MULTIPLIERS[tierDifference.toString()] || 1.0;
            
            // 4. Soma de Dano Potencial
            const damageSum = a_FP - m_Defense + d_Margin + r_prof;
            
            // 5. Cálculo Final e Clamping
            const finalDamage = Math.max(0, damageSum) * m_DTA;

            return { 
                damage: Math.round(finalDamage), 
                a_FP: a_FP,
                d_Margin: d_Margin,
                status: `SUCESSO. DTA Multiplier: x${m_DTA}`
            };
        }

        function runDamageCalculation() {
            // 1. Leitura dos Inputs e Sanitização
            const a_Ecur = parseInt(document.getElementById('a-ecur').value) || 0;
            const a_Tier = document.getElementById('a-tier').value.toUpperCase().trim() || '0';
            const d_Ecur = parseInt(document.getElementById('d-ecur').value) || 0;
            const d_Tier = document.getElementById('d-tier').value.toUpperCase().trim() || '0';
            const d100_A = parseInt(document.getElementById('a-d100').value) || 100;
            const r_prof = parseInt(document.getElementById('a-rprof').value) || 0;
            const d100_D = parseInt(document.getElementById('d-d100').value) || 100;

            const result = calculateDamage(a_Ecur, a_Tier, d_Ecur, d_Tier, d100_A, r_prof, d100_D);
            
            // 2. Apresentação dos Resultados
            const mitigatedRoll = d100_A - r_prof;

            if (result.damage === 0 && mitigatedRoll > a_Ecur) {
                 document.getElementById('damage-output').textContent = "FALHA (Ataque Acima do Limite)";
                 document.getElementById('details-output').textContent = `Resultado Mitigado: ${mitigatedRoll}. Limite do Atacante: ${a_Ecur}.`;
            } else {
                 document.getElementById('damage-output').textContent = `${result.damage} HP`;
                 document.getElementById('details-output').textContent = 
                    `A_FP (Potencial): ${result.a_FP} | D_Margin (Defesa): ${result.d_Margin} | Status: ${result.status}`;
            }
        }
    </script>
    </body>
</html>
