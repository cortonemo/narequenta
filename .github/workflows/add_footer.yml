name: Add footer to Markdown files

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  add-footer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run footer script
        run: python .github/scripts/add_footer_new_file.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: add footer to Markdown files"
            git push
          else
            echo "No footer changes needed."
          fi
